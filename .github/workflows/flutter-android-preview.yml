name: Flutter Android preview

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.altaawuncharity --project-name altaawun_charity_app .
      - name: Configure Arabic app name
        run: bash tool/configure_app_name.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Build preview APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: altaawun-android-preview
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
