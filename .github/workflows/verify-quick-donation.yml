name: Verify quick donation IQD USD and cart Android iOS

on:
  push:
    branches: [fix/restore-quick-donation-android-286-ios-238]
    paths:
      - 'lib/charity_account_page.dart'
      - 'lib/quick_donation_widget.dart'
      - 'lib/main.dart'
      - 'pubspec.yaml'
      - '.github/workflows/verify-quick-donation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android app compilation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Android
        run: |
          flutter create --platforms=android --org com.altaawuncharity --project-name altaawun_charity_app .
          bash tool/configure_app_name.sh && bash tool/configure_firebase.sh
          python3 tool/generate_notification_tones.py
          python3 tool/enable_android_desugaring.py
          mkdir -p android/app/src/main/res/raw
          for tone in urgent news soft; do
            cp "assets/tones/${tone}.wav" "android/app/src/main/res/raw/altaawun_${tone}.wav"
          done
          flutter pub get
      - name: Analyze shared account and home UI
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/charity_account_page.dart lib/main.dart lib/quick_donation_widget.dart
      - name: Compile debug APK (do not publish)
        run: flutter build apk --debug --build-name=1.0.15 --build-number=286
      - name: Upload Android test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: altaawun-android-test-1.0.15-286
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator compilation
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare iOS
        run: |
          flutter create --platforms=ios --org com.altaawun --project-name altaawun_charity_app .
          python3 tool/generate_notification_tones.py
          flutter pub get
      - name: Analyze shared account and home UI
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/charity_account_page.dart lib/main.dart lib/quick_donation_widget.dart
      - name: Compile simulator build (do not publish)
        run: flutter build ios --simulator --debug --no-codesign
