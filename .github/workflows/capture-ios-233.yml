name: Capture iPhone App Store Screenshot
on:
  push:
    branches: [screenshots/ios-233]
    paths: [.github/workflows/capture-ios-233.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Boot iPhone Pro Max simulator
        run: |
          device="$(xcrun simctl list devices available -j | python3 -c 'import sys,json; ds=[d for runtime in json.load(sys.stdin)["devices"].values() for d in runtime if d["name"] in ("iPhone 16 Pro Max","iPhone 17 Pro Max","iPhone 18 Pro Max")]; assert ds, "No supported Pro Max simulator"; print(ds[-1]["udid"])')"
          echo "SIMULATOR_ID=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
      - name: Build the app for iOS Simulator
        run: |
          flutter create --platforms=ios --org com.altaawun --project-name altaawun_charity_app .
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/main.dart')
          source = path.read_text()
          original = 'home: const SplashScreen(),'
          assert source.count(original) == 1
          source = source.replace(original, 'home: const CharityShell(),')
          start = source.index('class _CharityShellState')
          init = source.index('    super.initState();', start) + len('    super.initState();')
          navigation = """
              Timer(const Duration(seconds: 45), () { if (mounted) go(3); });
              Timer(const Duration(seconds: 90), () { if (mounted) go(4); });
              Timer(const Duration(seconds: 135), () { if (mounted) go(7); });
          """
          path.write_text(source[:init] + navigation + source[init:])
          PY
          flutter build ios --simulator --debug --no-codesign
      - name: Capture the running app
        run: |
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          app=build/ios/iphonesimulator/Runner.app
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState discharging --batteryLevel 100
          xcrun simctl install "$SIMULATOR_ID" "$app"
          xcrun simctl launch "$SIMULATOR_ID" "$bundle_id"
          sleep 30
          mkdir -p screenshots
          for name in 01-Home 02-Sponsorship-and-Donations 03-News 04-Account; do
            xcrun simctl io "$SIMULATOR_ID" screenshot "screenshots/$name.png"
            sips -g pixelWidth -g pixelHeight "screenshots/$name.png"
            if [ "$name" != 04-Account ]; then sleep 45; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: altaawun-iphone-screenshots
          path: screenshots/*.png
          if-no-files-found: error
