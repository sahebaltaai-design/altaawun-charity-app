
name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'tool/configure_app_name.sh'
      - 'android/app/src/main/res/values/strings.xml'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate preview notification sounds
        run: |
          python3 - <<'PY'
          import math, wave, struct
          from pathlib import Path
          out = Path('assets/tones')
          out.mkdir(parents=True, exist_ok=True)
          sr=22050
          tones = {
              'urgent': [(880,.16),(0,.09),(1100,.18),(0,.08),(880,.23)],
              'news': [(523,.22),(659,.22),(784,.32)],
              'soft': [(392,.36),(523,.40)],
              'default': [(660,.18),(0,.08),(660,.22)],
          }
          for name, notes in tones.items():
              samples=[]
              for freq,duration in notes:
                  count=int(sr*duration)
                  for i in range(count):
                      fade=min(1,i/(sr*.015),(count-i)/(sr*.045))
                      v=0 if not freq else math.sin(2*math.pi*freq*i/sr)*max(0,fade)*.3
                      samples.append(struct.pack('<h',int(v*32767)))
              with wave.open(str(out/f'{name}.wav'),'wb') as f:
                  f.setnchannels(1);f.setsampwidth(2);f.setframerate(sr)
                  f.writeframes(b''.join(samples))
          PY

      - name: Create Android platform
        run: |
          flutter create --platforms=android \
            --org com.altaawuncharity .

      - name: Enable microphone permission for opt-in voice assistant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if permission not in s:
              s = s.replace('<application', permission + '\n    <application', 1)
          # Voice recognition is optional: do not filter devices without a microphone.
          feature = '<uses-feature android:name="android.hardware.microphone" android:required="false" />'
          if 'android.hardware.microphone' not in s:
              s = s.replace('<application', feature + '\n    <application', 1)
          queries = '<queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>'
          if 'android.speech.RecognitionService' not in s:
              s = s.replace('<application', queries + '\n    <application', 1)
          p.write_text(s)
          PY

      - name: Install Android notification sound resources
        run: |
          mkdir -p android/app/src/main/res/raw
          for tone in urgent news soft; do
            cp "assets/tones/${tone}.wav" "android/app/src/main/res/raw/altaawun_${tone}.wav"
          done

      - name: Configure Arabic app name
        run: bash tool/configure_app_name.sh && bash tool/configure_firebase.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if p.exists():
              s = p.read_text()
              s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              p = Path('android/app/build.gradle')
              s = p.read_text().replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              s += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          p.write_text(s)
          PY

      - name: Generate Android launcher icons from charity emblem
        run: |
          python3 -m pip install --user Pillow numpy
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import xml.etree.ElementTree as ET
          src = Path('assets/png_style_emblem_the_same_arabic_logo_arched_em.png')
          if not src.is_file():
              raise SystemExit('Missing uploaded charity icon: assets/png_style_emblem_the_same_arabic_logo_arched_em.png')
          im = Image.open(src).convert('RGBA')
          # Remove only the source image's outer black canvas, not the
          # black Arabic lettering inside the emblem.
          from PIL import ImageDraw
          for corner in [(0, 0), (im.width - 1, 0),
                         (0, im.height - 1),
                         (im.width - 1, im.height - 1)]:
              if max(im.getpixel(corner)[:3]) < 65:
                  ImageDraw.floodfill(im, corner, (0, 0, 0, 0), thresh=42)
          box = im.getchannel('A').getbbox()
          if box:
              margin = max(2, int(max(box[2]-box[0],box[3]-box[1]) * .06))
              im = im.crop((max(0,box[0]-margin),max(0,box[1]-margin),
                            min(im.width,box[2]+margin),min(im.height,box[3]+margin)))
          root = Path('android/app/src/main/res')
          for suffix, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              out = Image.new('RGBA',(size,size),(255,255,255,255))
              icon = im.copy()
              icon.thumbnail((int(size*.80),int(size*.82)),Image.Resampling.LANCZOS)
              out.alpha_composite(icon,((size-icon.width)//2,(size-icon.height)//2))
              dest=root/('mipmap-'+suffix)
              dest.mkdir(parents=True,exist_ok=True)
              out.convert('RGB').save(dest/'ic_launcher.png')
          # Replace Flutter's adaptive launcher foreground and background too.
          fg=root/'drawable-nodpi'
          fg.mkdir(parents=True,exist_ok=True)
          size=432
          out=Image.new('RGBA',(size,size),(0,0,0,0))
          icon=im.copy()
          icon.thumbnail((312,312),Image.Resampling.LANCZOS)
          out.alpha_composite(icon,((size-icon.width)//2,(size-icon.height)//2))
          out.save(fg/'altaawun_launcher_foreground.png')
          adaptive=root/'mipmap-anydpi-v26'
          adaptive.mkdir(parents=True,exist_ok=True)
          xml='''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white"/>
              <foreground android:drawable="@drawable/altaawun_launcher_foreground"/>
          </adaptive-icon>'''
          (adaptive/'ic_launcher.xml').write_text(xml,encoding='utf-8')
          PY

      - name: Minimize mandatory Android system splash and match school artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path('android/app/src/main/res')
          android_uri = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_uri)
          key = lambda x: '{' + android_uri + '}' + x
          def ensure_item(style, name, value):
              child = next((el for el in style.findall('item') if el.get('name') == name), None)
              if child is None:
                  child = ET.SubElement(style, 'item', {'name': name})
              child.text = value
          def ensure_launch_theme(path):
              path.parent.mkdir(parents=True, exist_ok=True)
              if path.exists():
                  tree = ET.parse(path)
                  resources = tree.getroot()
              else:
                  resources = ET.Element('resources')
                  tree = ET.ElementTree(resources)
              style = next((el for el in resources.findall('style') if el.get('name') == 'LaunchTheme'), None)
              if style is None:
                  style = ET.SubElement(resources, 'style', {'name': 'LaunchTheme', 'parent': '@android:style/Theme.Light.NoTitleBar'})
              return tree, style

          # On Android 12+, the OS must show a brief native starting window.
          # Replace its oversized icon with a transparent drawable and a sky-
          # colored background. The real school photo follows immediately.
          drawable = root / 'drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / 'empty_splash_icon.xml').write_text(
              '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">'
              '<solid android:color="@android:color/transparent"/></shape>',
              encoding='utf-8')
          tree, style = ensure_launch_theme(root / 'values-v31/styles.xml')
          ensure_item(style, 'android:windowSplashScreenBackground', '@android:color/white')
          ensure_item(style, 'android:windowSplashScreenAnimatedIcon', '@mipmap/ic_launcher')
          ensure_item(style, 'android:windowSplashScreenIconBackgroundColor', '@android:color/white')
          tree.write(root / 'values-v31/styles.xml', encoding='utf-8', xml_declaration=True)

          # On older versions the launch window can directly show the school
          # background, avoiding a separate white page with a centered emblem.
          tree, style = ensure_launch_theme(root / 'values/styles.xml')
          ensure_item(style, 'android:windowBackground', '@drawable/school_launch_background')
          tree.write(root / 'values/styles.xml', encoding='utf-8', xml_declaration=True)
          (drawable / 'school_launch_background.xml').write_text(
              '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">'
              '<item><bitmap android:gravity="fill" android:src="@drawable/school_splash"/></item>'
              '</layer-list>', encoding='utf-8')
          print('Native Android starting window prepared; Flutter owns actual school welcome screen')
          PY

      - name: Remove only captured status bar and unused green footer from splash
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('assets/welcome_background-2.png')
          image = Image.open(p).convert('RGB')
          # Remove the old captured phone status bar. Keep most of the
          # built-in green footer to provide a natural area for the caption.
          # This yields an almost phone-sized aspect ratio, requiring only
          # mild stretching in the no-crop smart-fit mode. Never crop the
          # crest, charity name, school, pupils or colored lower ribbon.
          top = round(image.height * 0.035)
          bottom = round(image.height * 0.94)
          if bottom <= top or bottom > image.height:
              raise SystemExit('Unexpected source splash dimensions')
          clean = image.crop((0, top, image.width, bottom))
          clean.save(p, 'PNG', optimize=True)
          # Use this SAME artwork for the pre-Android-12 native launch window.
          native = Path('android/app/src/main/res/drawable-nodpi/school_splash.png')
          native.parent.mkdir(parents=True, exist_ok=True)
          clean.save(native, 'PNG', optimize=True)
          print(f'Splash prepared: {image.size} -> {clean.size}, artwork preserved')
          PY

      - name: Configure release signing for Play Store
        if: ${{ github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, base64
          root = Path('android')
          (root / 'upload-keystore.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64']))
          props = root / 'key.properties'
          props.write_text('storeFile=upload-keystore.jks\nstorePassword=' + os.environ['KEYSTORE_PASSWORD'] + '\nkeyAlias=' + os.environ['KEY_ALIAS'] + '\nkeyPassword=' + os.environ['KEY_PASSWORD'] + '\n')
          gradle = root / 'app/build.gradle.kts'
          if gradle.exists():
              s = gradle.read_text()
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s
              s = s.replace('android {', 'val uploadProps = Properties().apply { load(FileInputStream(rootProject.file("key.properties"))) }\n\nandroid {', 1)
              s = s.replace('    buildTypes {', '''    signingConfigs {
                  create("uploadRelease") {
                      keyAlias = uploadProps["keyAlias"] as String
                      keyPassword = uploadProps["keyPassword"] as String
                      storeFile = rootProject.file(uploadProps["storeFile"] as String)
                      storePassword = uploadProps["storePassword"] as String
                  }
              }
              buildTypes {''', 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("uploadRelease")')
              gradle.write_text(s)
          else:
              raise SystemExit('Expected Flutter Kotlin Gradle build file not found')
          PY

      - name: Build signed Play Store AAB
        if: ${{ github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=ALTAAWUN_UPDATE_CHANNEL=alpha

      - name: Upload signed Play Store AAB
        if: ${{ github.event_name != 'pull_request' && env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        uses: actions/upload-artifact@v4
        with:
          name: altaawun-charity-play-store-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Build APK
        run: flutter build apk --debug --build-number=${{ github.run_number }} --dart-define=ALTAAWUN_UPDATE_CHANNEL=alpha

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: altaawun-charity-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
