
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform
        run: |
          flutter create --platforms=android \
            --org com.altaawuncharity .

      - name: Configure Arabic app name
        run: bash tool/configure_app_name.sh && bash tool/configure_firebase.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if p.exists():
              s = p.read_text()
              s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              p = Path('android/app/build.gradle')
              s = p.read_text().replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              s += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          p.write_text(s)
          PY

      - name: Generate Android launcher icons from charity emblem
        run: |
          python3 -m pip install --user Pillow numpy
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import xml.etree.ElementTree as ET
          src = Path('assets/altaawun-charity-icon-final.png')
          if not src.is_file():
              raise SystemExit('Missing uploaded charity icon: assets/altaawun-charity-icon-final.png')
          im = Image.open(src).convert('RGBA')
          # The uploaded image contains wide black margins around the emblem.
          # Crop the visible non-black artwork before scaling it.
          from PIL import ImageChops
          rgb = im.convert('RGB')
          mask = rgb.convert('L').point(lambda p: 255 if p > 28 else 0)
          box = mask.getbbox()
          if box:
              margin = max(2, int(max(box[2]-box[0],box[3]-box[1]) * .06))
              im = im.crop((max(0,box[0]-margin),max(0,box[1]-margin),
                            min(im.width,box[2]+margin),min(im.height,box[3]+margin)))
          root = Path('android/app/src/main/res')
          for suffix, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              out = Image.new('RGBA',(size,size),(0,0,0,255))
              icon = im.copy()
              icon.thumbnail((int(size*.94),int(size*.86)),Image.Resampling.LANCZOS)
              out.alpha_composite(icon,((size-icon.width)//2,(size-icon.height)//2))
              dest=root/('mipmap-'+suffix)
              dest.mkdir(parents=True,exist_ok=True)
              out.convert('RGB').save(dest/'ic_launcher.png')
          # Replace Flutter's adaptive launcher foreground and background too.
          fg=root/'drawable-nodpi'
          fg.mkdir(parents=True,exist_ok=True)
          size=432
          out=Image.new('RGBA',(size,size),(0,0,0,0))
          icon=im.copy()
          icon.thumbnail((350,350),Image.Resampling.LANCZOS)
          out.alpha_composite(icon,((size-icon.width)//2,(size-icon.height)//2))
          out.save(fg/'altaawun_launcher_foreground.png')
          adaptive=root/'mipmap-anydpi-v26'
          adaptive.mkdir(parents=True,exist_ok=True)
          xml='''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black"/>
              <foreground android:drawable="@drawable/altaawun_launcher_foreground"/>
          </adaptive-icon>'''
          (adaptive/'ic_launcher.xml').write_text(xml,encoding='utf-8')
          PY

      - name: Remove screenshot status bar from welcome background
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('assets/welcome_background-2.png')
          image = Image.open(p).convert('RGB')
          # Source artwork is a phone screenshot; remove the top status strip.
          # Preserve original dimensions to keep the splash layout consistent.
          top = round(image.height * 0.065)
          clean = image.crop((0, top, image.width, image.height))
          clean = clean.resize(image.size, Image.Resampling.LANCZOS)
          clean.save(p, 'PNG', optimize=True)
          PY

      - name: Build APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: altaawun-charity-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
