name: Package Altaawun Update Plugin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wordpress/altaawun-app-updates/**'
      - '.github/workflows/package-app-updates.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate WordPress plugin
        run: php -l wordpress/altaawun-app-updates/altaawun-app-updates.php
      - name: Build installable plugin ZIP
        run: |
          mkdir -p dist
          cd wordpress
          zip -r ../dist/altaawun-app-updates.zip altaawun-app-updates
      - uses: actions/upload-artifact@v4
        with:
          name: altaawun-app-updates-wordpress
          path: dist/altaawun-app-updates.zip
