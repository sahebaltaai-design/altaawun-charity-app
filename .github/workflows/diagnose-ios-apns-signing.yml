          content = path.read_text()
          content = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER\s*=\s*[^;]+;', 'PRODUCT_BUNDLE_IDENTIFIER = com.altaawun.charity;', content)
          content = re.sub(r'DEVELOPMENT_TEAM\s*=\s*[^;]+;', 'DEVELOPMENT_TEAM = ARR89Z96X6;', content)
          content = re.sub(r'CODE_SIGN_STYLE\s*=\s*Automatic;', 'CODE_SIGN_STYLE = Manual;', content)
          content = content.replace(
              'PRODUCT_BUNDLE_IDENTIFIER = com.altaawun.charity;',
              'PRODUCT_BUNDLE_IDENTIFIER = com.altaawun.charity;\n'
              '\t\t\t\tDEVELOPMENT_TEAM = ARR89Z96X6;\n'
              '\t\t\t\tCODE_SIGN_STYLE = Manual;\n'
              '\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n'
              '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "' + os.environ['PROFILE_UUID'] + '";'
          )
          path.write_text(content)
          PY
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>ARR89Z96X6</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.altaawun.charity</key><string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

