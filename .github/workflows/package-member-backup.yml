name: Package Altaawun Member Backup Plugin
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/otp-google-sponsorship-login
    paths:
      - 'wordpress/altaawun-member-backup/**'
      - '.github/workflows/package-member-backup.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: php -l wordpress/altaawun-member-backup/altaawun-member-backup.php
      - name: Package WordPress installable ZIP
        run: |
          mkdir -p dist
          cd wordpress
          zip -r ../dist/altaawun-member-backup-v1.0.0.zip altaawun-member-backup
      - uses: actions/upload-artifact@v4
        with:
          name: altaawun-member-backup-wordpress-v1.0.0
          path: dist/altaawun-member-backup-v1.0.0.zip
