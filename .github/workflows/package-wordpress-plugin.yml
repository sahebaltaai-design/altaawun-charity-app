name: Package WordPress Notifications Plugin
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wordpress-plugin/altaawun-notifications.php'
      - '.github/workflows/package-wordpress-plugin.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress-plugin/altaawun-notifications.php'
      - '.github/workflows/package-wordpress-plugin.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate WordPress plugin PHP
        run: |
          php -l wordpress-plugin/altaawun-notifications.php
          grep -q 'Version: 1.2.13' wordpress-plugin/altaawun-notifications.php
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image support for default welcome preview
        run: python -m pip install --quiet pillow
      - name: Package installable plugin ZIP and matching default preview artwork
        run: |
          mkdir -p dist/altaawun-notifications/assets
          cp wordpress-plugin/altaawun-notifications.php dist/altaawun-notifications/altaawun-notifications.php
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          image = Image.open('assets/welcome_background-2.png').convert('RGB')
          top = round(image.height * 0.035)
          bottom = round(image.height * 0.94)
          cleaned = image.crop((0, top, image.width, bottom))
          cleaned.save('dist/altaawun-notifications/assets/welcome_background-2.png', optimize=True)
          print('WordPress default preview:', cleaned.size)
          PY
          cd dist
          zip -r altaawun-notifications-v1.2.13.zip altaawun-notifications
      - uses: actions/upload-artifact@v4
        with:
          name: altaawun-notifications-v1.2.13
          path: dist/altaawun-notifications-v1.2.13.zip
