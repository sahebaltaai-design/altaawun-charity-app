name: Package WordPress Notifications Plugin
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wordpress-plugin/altaawun-notifications.php'
      - '.github/workflows/package-wordpress-plugin.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress-plugin/altaawun-notifications.php'
      - '.github/workflows/package-wordpress-plugin.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate WordPress plugin PHP
        run: |
          php -l wordpress-plugin/altaawun-notifications.php
          grep -q 'Version: 1.2.4' wordpress-plugin/altaawun-notifications.php
      - name: Package installable plugin ZIP
        run: |
          mkdir -p dist/altaawun-notifications
          cp wordpress-plugin/altaawun-notifications.php dist/altaawun-notifications/altaawun-notifications.php
          cd dist
          zip -r altaawun-notifications-v1.2.4.zip altaawun-notifications
      - uses: actions/upload-artifact@v4
        with:
          name: altaawun-notifications-v1.2.4
          path: dist/altaawun-notifications-v1.2.4.zip
