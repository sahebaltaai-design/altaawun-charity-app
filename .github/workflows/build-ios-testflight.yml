name: Build iOS IPA and TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate matching app and APNs notification sounds
        run: |
          python3 - <<'PY'
          import math, wave, struct
          from pathlib import Path
          out = Path('assets/tones')
          out.mkdir(parents=True, exist_ok=True)
          sr = 22050
          tones = {
              'urgent': [(880,.16),(0,.09),(1100,.18),(0,.08),(880,.23)],
              'news': [(523,.22),(659,.22),(784,.32)],
              'soft': [(392,.36),(523,.40)],
              'default': [(660,.18),(0,.08),(660,.22)],
          }
          for name, notes in tones.items():
              samples = []
              for freq, duration in notes:
                  count = int(sr * duration)
                  for i in range(count):
                      fade = min(1, i/(sr*.015), (count-i)/(sr*.045))
                      v = 0 if not freq else math.sin(2*math.pi*freq*i/sr)*max(0,fade)*.3
                      samples.append(struct.pack('<h', int(v*32767)))
              with wave.open(str(out/f'{name}.wav'), 'wb') as f:
                  f.setnchannels(1)
                  f.setsampwidth(2)
                  f.setframerate(sr)
                  f.writeframes(b''.join(samples))
          print('Created identical Android/iOS notification tone preview assets')
          PY

      - name: Prepare iOS project
        run: |
          flutter create --platforms=ios --org com.altaawun --project-name altaawun_charity_app .
          flutter pub get

      - name: Set iOS home screen app name to Altaawn
        run: |
          bash tool/configure_app_name.sh
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path('ios/Runner/Info.plist')
          with path.open('rb') as f:
              info = plistlib.load(f)
          info['CFBundleDisplayName'] = 'Altaawn'
          info['CFBundleName'] = 'Altaawn'
          with path.open('wb') as f:
              plistlib.dump(info, f)
          print('iOS launcher label:', info['CFBundleDisplayName'])
          PY

      - name: Generate iOS app icon from charity emblem
        run: |
          python3 -m venv "$RUNNER_TEMP/ios-icon-venv"
          "$RUNNER_TEMP/ios-icon-venv/bin/python" -m pip install Pillow
          "$RUNNER_TEMP/ios-icon-venv/bin/python" - <<'PY'
          import json
          from pathlib import Path

          from PIL import Image

          source = Path('assets/png_style_emblem_the_same_arabic_logo_arched_em.png')
          emblem = Image.open(source).convert('RGBA')
          # The source emblem has black outer canvas. Remove only dark pixels
          # connected to the four exterior corners; preserve black lettering.
          from PIL import ImageDraw
          for corner in [(0, 0), (emblem.width - 1, 0),
                         (0, emblem.height - 1),
                         (emblem.width - 1, emblem.height - 1)]:
              if max(emblem.getpixel(corner)[:3]) < 65:
                  ImageDraw.floodfill(emblem, corner, (0, 0, 0, 0), thresh=42)
          mask = emblem.getchannel('A')
          bounds = mask.getbbox()
          if bounds:
              left, top, right, bottom = bounds
              margin = max(2, int(max(right - left, bottom - top) * .06))
              emblem = emblem.crop((
                  max(0, left - margin), max(0, top - margin),
                  min(emblem.width, right + margin), min(emblem.height, bottom + margin),
              ))

          catalog = Path('ios/Runner/Assets.xcassets/AppIcon.appiconset')
          contents_path = catalog / 'Contents.json'
          contents = json.loads(contents_path.read_text())
          for entry in contents['images']:
              width, height = (float(value) for value in entry['size'].split('x'))
              scale = int(entry.get('scale', '1x').removesuffix('x'))
              width, height = round(width * scale), round(height * scale)
              filename = entry.setdefault('filename', f'CharityAppIcon-{width}x{height}.png')
              icon = Image.new('RGBA', (width, height), (255, 255, 255, 255))
              artwork = emblem.copy()
              artwork.thumbnail((int(width * .80), int(height * .82)), Image.Resampling.LANCZOS)
              icon.alpha_composite(artwork, ((width - artwork.width) // 2, (height - artwork.height) // 2))
              icon.convert('RGB').save(catalog / filename)
          contents_path.write_text(json.dumps(contents, indent=2) + '\n')
          PY

      - name: Bundle APNs sound files in the signed iOS app
        run: |
          set -euo pipefail
          for tone in urgent news soft; do
            afconvert -f caff -d LEI16@22050 "assets/tones/${tone}.wav" "ios/Runner/altaawun_${tone}.caf"
            test -s "ios/Runner/altaawun_${tone}.caf"
          done
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          runner = project.targets.find { |target| target.name == 'Runner' }
          abort 'Runner target missing' unless runner
          group = project.main_group.find_subpath('Runner', false)
          abort 'Runner group missing' unless group
          %w[urgent news soft].each do |tone|
            filename = "altaawun_#{tone}.caf"
            file = group.files.find { |reference| reference.path == filename }
            file ||= group.new_file(filename)
            unless runner.resources_build_phase.files_references.include?(file)
              runner.resources_build_phase.add_file_reference(file, true)
            end
          end
          project.save
          puts 'APNs custom urgent/news/soft sound files included in Runner'
          RUBY

      - name: Configure iOS privacy usage descriptions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          info_path = Path("ios/Runner/Info.plist")
          with info_path.open("rb") as f:
              info = plistlib.load(f)
          info["NSMicrophoneUsageDescription"] = (
              "يستخدم التطبيق الميكروفون للاستماع إلى أوامرك الصوتية والبحث بالصوت عند اختيارك هذه الميزة."
          )
          info["NSSpeechRecognitionUsageDescription"] = (
              "يستخدم التطبيق التعرف على الكلام لتحويل أوامرك الصوتية إلى نص لتنفيذ البحث الصوتي."
          )
          with info_path.open("wb") as f:
              plistlib.dump(info, f)
          for key in ("NSMicrophoneUsageDescription", "NSSpeechRecognitionUsageDescription"):
              assert info.get(key), f"Missing usage description: {key}"
          print("iOS microphone and speech recognition purpose strings configured")
          PY

      - name: Configure iOS push notification entitlements and APNs registration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          entitlements = Path("ios/Runner/Runner.entitlements")
          with entitlements.open("wb") as f:
              plistlib.dump({"aps-environment": "production"}, f)
          info_path = Path("ios/Runner/Info.plist")
          with info_path.open("rb") as f:
              info = plistlib.load(f)
          info["FirebaseAppDelegateProxyEnabled"] = True
          info["UIBackgroundModes"] = sorted(set(info.get("UIBackgroundModes", [])) | {"remote-notification"})
          with info_path.open("wb") as f:
              plistlib.dump(info, f)
          PY
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          abort 'Runner target not found' unless target
          target.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'Runner/Runner.entitlements'
          end
          project.save
          RUBY
          echo "Configured production APNs entitlement and remote notification background mode"

      - name: Ensure native iOS APNs registration and Firebase token forwarding
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('ios/Runner/AppDelegate.swift')
          source = path.read_text()
          if 'import FirebaseMessaging' not in source:
              source = source.replace('import UIKit', 'import UIKit\nimport FirebaseMessaging')
          if 'application.registerForRemoteNotifications()' not in source:
              anchor = 'GeneratedPluginRegistrant.register(with: self)'
              if anchor not in source:
                  raise RuntimeError('Unable to locate Flutter plugin registration')
              source = source.replace(anchor, anchor + '\n    application.registerForRemoteNotifications()', 1)
          if 'didRegisterForRemoteNotificationsWithDeviceToken' not in source:
              pos = source.rfind('}')
              if pos < 0:
                  raise RuntimeError('Unable to locate AppDelegate closing brace')
              callbacks = """
            override func application(_ application: UIApplication,
              didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
              Messaging.messaging().apnsToken = deviceToken
              NSLog("Altaawun APNs registration succeeded; token length: %d", deviceToken.count)
              super.application(application, didRegisterForRemoteNotificationsWithDeviceToken: deviceToken)
            }

            override func application(_ application: UIApplication,
              didFailToRegisterForRemoteNotificationsWithError error: Error) {
              NSLog("Altaawun APNs registration failed: %@", error.localizedDescription)
              super.application(application, didFailToRegisterForRemoteNotificationsWithError: error)
            }
          """
              source = source[:pos] + callbacks + source[pos:]
          path.write_text(source)
          assert 'Messaging.messaging().apnsToken = deviceToken' in source
          print('APNs registration and Firebase token forwarding configured')
          PY

      - name: Bundle Firebase iOS configuration
        run: |
          set -euo pipefail
          test -f ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          runner = project.targets.find { |target| target.name == 'Runner' }
          abort 'Runner target missing' unless runner
          group = project.main_group.find_subpath('Runner', false)
          abort 'Runner group missing' unless group
          file = group.files.find { |reference| reference.path == 'GoogleService-Info.plist' }
          file ||= group.new_file('GoogleService-Info.plist')
          existing = runner.resources_build_phase.files_references
          runner.resources_build_phase.add_file_reference(file, true) unless existing.include?(file)
          project.save
          puts 'Firebase config added to iOS Runner app resources'
          RUBY

      - name: Install signing credentials
        env:
          CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          test "$PROFILE_APP_ID" = "ARR89Z96X6.com.altaawun.charity"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Apple Distribution:'

      - name: Configure Xcode signing and export
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          content = path.read_text()
          import re
          content = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER\s*=\s*[^;]+;', 'PRODUCT_BUNDLE_IDENTIFIER = com.altaawun.charity;', content)
          content = re.sub(r'DEVELOPMENT_TEAM\s*=\s*[^;]+;', 'DEVELOPMENT_TEAM = ARR89Z96X6;', content)
          content = re.sub(r'CODE_SIGN_STYLE\s*=\s*Automatic;', 'CODE_SIGN_STYLE = Manual;', content)
          # Set signing at the target build-configuration level, preserving unrelated project settings.
          content = content.replace('PRODUCT_BUNDLE_IDENTIFIER = com.altaawun.charity;', 
              'PRODUCT_BUNDLE_IDENTIFIER = com.altaawun.charity;\n\t\t\t\tDEVELOPMENT_TEAM = ARR89Z96X6;\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "' + __import__('os').environ['PROFILE_UUID'] + '";')
          path.write_text(content)
          PY
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>ARR89Z96X6</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.altaawun.charity</key><string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -list -project ios/Runner.xcodeproj

      - name: Build signed IPA
        run: |
          flutter build ipa --release --build-name=1.0.21 --build-number=253 --export-options-plist=ios/ExportOptions.plist

      - name: Save IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: altaawun-ios-signed-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$APPSTORE_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          IPA_FILE=$(find build/ios/ipa -name '*.ipa' -print -quit)
          test -n "$IPA_FILE"
          xcrun altool --upload-app --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
